name: CI/CD to Server

on:
  push:
    branches: [master, dev]

jobs:
  build-test-push:
    if: github.ref_name == 'dev' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test_db
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:${{ github.sha }} .

      - name: Run Tests inside Docker Image
        run: |
          docker run --rm \
            --env-file .env.test \
            -e TEST_DATABASE_URL=${{ env.TEST_DATABASE_URL }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:${{ github.sha }} \
            pytest --maxfail=3 --disable-warnings

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-test-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Determine Deployment Path and Tag
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "DEPLOY_PATH=apps/crm-backend" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_PATH=apps/crm-backend-dev" >> $GITHUB_ENV
          else
            echo "❌ Неизвестная ветка! Прерываем процесс."
            exit 1
          fi
          echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Pull Image and Run Migrations
        run: |
          echo "🗂️ Подтягиваем образ и проводим миграции..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd $DEPLOY_PATH &&
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:$DEPLOY_TAG &&
            docker run --rm \
              -v \$(pwd):/app \
              --network crm_network \
              ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:$DEPLOY_TAG \
              /bin/sh -c 'aerich init -t app.database.config.TORTOISE_ORM && aerich upgrade'
          "

      - name: Deploy Application
        run: |
          echo "🚀 Деплой на сервер..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd $DEPLOY_PATH &&
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:$DEPLOY_TAG &&
            TAG=$DEPLOY_TAG docker compose up -d
          "
