name: CI/CD to Server

on:
  push:
    branches: [master, dev]

jobs:
  build-test-push:
    if: github.ref_name == 'dev' || github.ref_name == 'master'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test_db
      PYTHONUNBUFFERED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true


      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --cache-from=type=local,src=/tmp/.buildx-cache \
            --cache-to=type=local,dest=/tmp/.buildx-cache \
            --tag gloomylime/crm-backend:${{ github.sha }} \
            --push . 


      - name: Run Tests inside Docker Image
        run: |
          docker run --rm \
            --env-file .env.test \
            -e TEST_DATABASE_URL=${{ env.TEST_DATABASE_URL }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/crm-backend:${{ github.sha }} \
            pytest --maxfail=3 --disable-warnings


  deploy:
    runs-on: ubuntu-latest
    needs: build-test-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Determine Deployment Path and Tag
        run: |
          if [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "DEPLOY_PATH=apps/crm-backend" >> $GITHUB_ENV
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "DEPLOY_PATH=apps/crm-backend-dev" >> $GITHUB_ENV
          else
            echo "❌ Неизвестная ветка! Прерываем процесс."
            exit 1
          fi
          echo "DEPLOY_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Pull Code and Run Migrations
        run: |
          echo "🗂️ Обновляем код и запускаем миграции..."
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} "
            cd $DEPLOY_PATH &&
            git pull origin ${GITHUB_REF##*/} &&
            docker compose run --rm web aerich upgrade || echo 'No migrations run'
          "

      - name: Deploy Backend
        run: |
          echo "🚀 Деплой..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            set -e

            cd $DEPLOY_PATH
            git pull origin ${GITHUB_REF##*/}

            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
            docker pull ${DOCKERHUB_USERNAME}/crm-backend:${DEPLOY_TAG}

            if [ ! -f .env ]; then touch .env; fi
            grep -q "^TAG=" .env && sed -i "s/^TAG=.*/TAG=${DEPLOY_TAG}/" .env || echo "TAG=${DEPLOY_TAG}" >> .env

            docker compose -f docker-compose.app.yml stop web
            docker compose -f docker-compose.app.yml rm -f web
            docker compose -f docker-compose.app.yml up -d web

            exit 0
          EOF

