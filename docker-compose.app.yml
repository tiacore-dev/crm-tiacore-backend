services:
  aerich:
    build: .
    command: ["aerich", "upgrade"]
    volumes:
      - .:/app
      - .env:/app/.env 
    env_file:
      - .env  
    networks:
      - crm_network

  web:
    image: ${DOCKERHUB_USERNAME}/crm-backend:${TAG}
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "${PORT}:8000"
    volumes:
      - ./logs:/app/logs  
      - .env:/app/.env 
    command: >
       gunicorn -c gunicorn.conf.py run:app
    networks:
      - crm_network

networks:
  crm_network:
    external: true
