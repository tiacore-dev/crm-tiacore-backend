services:
  web:
    image: ${DOCHERHUB_USERNAME}/crm-backend:${TAG}
    env_file:
      - .env
    tty: true
    stdin_open: true
    restart: always
    ports:
      - "${PORT}:8000"
    volumes:
      - ./logs:/app/logs  
    command: >
       gunicorn -c gunicorn.conf.py run:app
    networks:
      - crm_network

networks:
  crm_network:
    external: true
