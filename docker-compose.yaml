services:
  aerich:
    build: .
    command: ["/bin/sh", "-c", "aerich init -t app.database.config.TORTOISE_ORM && aerich upgrade"]
    volumes:
      - .:/app
    networks:
      - crm_network
    env_file:
      - .env
      
  test:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    command: bash -c "pytest --maxfail=3 --disable-warnings || exit 1"
    depends_on:
      - aerich
    networks:
      - crm_network
    volumes:
      - .:/app
      - ./tests:/app/tests
    environment:
      - PYTHONPATH=/app
    deploy:
      replicas: ${TEST_MODE}
    env_file:
      - .env


  web:
    tty: true
    stdin_open: true
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=local,src=/tmp/.buildx-cache
      cache_to:
        - type=local,dest=/tmp/.buildx-cache
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - aerich
    volumes:
      - .:/app
    command: >
       gunicorn -c gunicorn.conf.py run:app
    networks:
      - crm_network
    env_file:
      - .env

networks:
  crm_network:
    external: true
